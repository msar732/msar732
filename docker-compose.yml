version: "3.9"
services:
  web:
    build: .
    command: gunicorn trade_india.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - media:/app/media
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_india}
      POSTGRES_USER: ${POSTGRES_USER:-trade_india}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade_india}
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
volumes:
  pgdata:
  media: