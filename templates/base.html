<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{% block title %}Trade India - Buy & Sell{% endblock %}</title>
	<meta name="description" content="Buy, sell, and rent items and property across India. Search by state and district." />
	<link rel="canonical" href="{{ request.build_absolute_uri|default:'/' }}" />
	<meta property="og:site_name" content="Trade India" />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="{% block og_title %}Trade India{% endblock %}" />
	<meta property="og:description" content="{% block og_description %}Marketplace for India with AI-verified listings.{% endblock %}" />
	{% block extra_head %}{% endblock %}
	<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="bg-gradient-to-br from-indigo-100 via-white to-pink-100 min-h-screen">
	<header class="container mx-auto px-4 py-4">
		<div class="glass flex items-center justify-between p-4 rounded-2xl">
			<a href="/" class="font-extrabold text-2xl text-indigo-700">TradeIndia</a>
			<nav class="flex items-center gap-4">
				<a href="/listings/" class="chip">Browse</a>
				{% if user.is_authenticated %}
					<a class="chip" href="/listings/create/">Post</a>
					<a class="chip" href="/accounts/logout/">Logout</a>
				{% else %}
					<a class="chip" href="/accounts/login/">Login</a>
					<a class="chip" href="/accounts/signup/">Sign up</a>
				{% endif %}
			</nav>
		</div>
	</header>
	<main class="container mx-auto px-4 py-6">
		{% block content %}{% endblock %}
	</main>
	<footer class="container mx-auto px-4 py-12">
		<div class="glass p-6 rounded-2xl text-sm text-gray-600">
			<p>© {{ now|date:"Y" }} Trade India. Built with Django.</p>
		</div>
	</footer>
	{% block extra_scripts %}{% endblock %}
</body>
</html>
