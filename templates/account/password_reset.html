{% extends "account/base.html" %}
{% block inner %}
<h1 class="text-2xl font-extrabold">Reset password</h1>
<form method="post" class="grid grid-cols-1 gap-4" action="{% url 'account_reset_password' %}">
	{% csrf_token %}
	<label>Email</label>
	{{ form.email }}
	<button class="btn">Send reset link</button>
</form>
{% endblock %}
