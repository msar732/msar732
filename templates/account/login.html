{% extends "account/base.html" %}
{% load i18n %}
{% block inner %}
<h1 class="text-2xl font-extrabold">Sign in</h1>
<form class="grid grid-cols-1 gap-4" method="post" action="{% url 'account_login' %}">
	{% csrf_token %}
	{{ form.non_field_errors }}
	<label>Email</label>
	{{ form.login }}
	<label>Password</label>
	{{ form.password }}
	<button class="btn">Sign in</button>
</form>
<p><a class="chip" href="{% url 'account_reset_password' %}">Forgot password?</a></p>
<p>New here? <a class="chip" href="{% url 'account_signup' %}">Create an account</a></p>
{% endblock %}
