{% extends 'base.html' %}
{% load widget_tweaks %}
{% block content %}
<div class="container">
  <h2>Login</h2>
  <form method="post" class="glass" style="padding:16px">
    {% csrf_token %}
    {% for field in form %}
      <div style="margin-bottom:8px">{{ field.label_tag }}{{ field|add_class:'input' }}{{ field.errors }}</div>
    {% endfor %}
    <button class="btn" type="submit">Login</button>
  </form>
</div>
{% endblock %}
